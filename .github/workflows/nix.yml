name: nix

# Documentation-only changes do not rebuild anything. The packages carry
# README.md, so a docs edit does technically change their contents, but not in
# a way worth twenty minutes of containers and an uncached nix build.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSES/**'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs
  workflow_call:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # buildRustPackage runs `cargo test` itself, so this is a full check and
      # not just a link.
      - run: nix build .#default --print-build-logs
      - run: nix flake check --print-build-logs
      - run: nix build .#headless --print-build-logs

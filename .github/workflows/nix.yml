name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@main
      # buildRustPackage runs `cargo test` itself, so this is a full check and
      # not just a link.
      - run: nix build .#default --print-build-logs
      - run: nix flake check --print-build-logs
      - run: nix build .#headless --print-build-logs

[package]
name = "staramp"
version = "0.1.1"
edition = "2021"
rust-version = "1.90"
description = "A Winamp-feel terminal music player for local libraries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bstar/staramp"
keywords = ["music", "player", "tui", "winamp", "audio"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
# The shared foundation, lifted out of this repository so starcord can use the
# same theme engine, picture rendering and docked panels rather than a copy of
# them that drifts. It also re-exports ratatui, crossterm, ratatui-image and
# image, which is why none of those appear below any more: a widget built
# against a second copy of ratatui does not satisfy a signature expecting the
# first, and the compiler reports that as two identical version numbers
# disagreeing, which explains nothing to whoever reads it.
#
# `wsz` is Winamp skin import and `net` the HTTP client, both of which only
# this application wants; `image` is on by default and draws the cover art.
#
# Pinned to a tag rather than to a branch or a revision. A branch would make
# the build depend on what that branch happened to hold this morning, and a
# bare revision says nothing about compatibility; a tag is a release someone
# decided to make, and moving to a new one is its own commit ("Take starkit
# 0.Y") with its own `Cargo.lock` change to read.
#
# To try a starkit change from here before it is tagged, put this in an
# untracked `.cargo/config.toml` and delete it once the tag exists:
#
#     [patch."https://github.com/bstar/starkit"]
#     starkit = { path = "../starkit" }
#
# The version requirement is here alongside the tag so this is not a wildcard
# dependency -- `deny.toml` refuses those, and rightly: a dependency with no
# stated version is one nobody can tell has moved. It also makes the `[patch]`
# above fail loudly rather than silently if the local checkout has drifted to
# a version this no longer accepts.
starkit = { git = "https://github.com/bstar/starkit", tag = "v0.3.0", version = "0.3", features = [
    "image",
    "wsz",
    "net",
] }

# CLI
clap = { version = "4", features = ["derive"] }

# Errors
anyhow = "1"
thiserror = "2"

# Logging — file only; stdout would corrupt the alternate screen. The
# subscriber and the file writer are starkit's, which is where `init` is; what
# is needed here is the macros that write the lines.
tracing = "0.1"

# Universal decode path: libavformat/libavcodec linked in-process. Not a
# subprocess -- real seeking, no respawn, no spawn latency per track, and no
# runtime dependency on an `ffmpeg` binary being on PATH.
# Only what a music player uses. The default feature set also pulls avfilter,
# avdevice and swscale -- video plumbing this never touches, which made the
# build need three more -dev packages than the documented dependency list, and
# fail on a clean Debian.
ffmpeg-next = { version = "9", default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
] }

# Output. cpal rather than rodio: rodio owns mixing, resampling and queueing,
# which are exactly the three things this design has to control for gaplessness,
# bit-perfect passthrough and the PCM tap.
cpal = "0.16"

# Lock-free SPSC ring. The output callback must never allocate, never lock and
# never touch I/O -- that single rule removes most of the complexity that a
# mutex-guarded output thread forces on you.
rtrb = "0.3"

# Command bus between the UI/CLI and the decode thread.
crossbeam-channel = "0.5"

# Lock-free publication of EQ coefficients and volume into the audio callback.
# No mutex is ever taken on the audio path.
arc-swap = "1"

# CUE sheets are not reliably UTF-8. 37 of the 1,123 sheets in the reference
# library are CP1251 or CP1252, and String::from_utf8 hard-fails every one.
encoding_rs = "0.8"
chardetng = "0.1"

# Cue FILE references sometimes differ from the file on disk only by Unicode
# normalisation form (Hattin vs Hattin with diaeresis).
unicode-normalization = "0.1"

# Parallel directory walk. ripgrep's, already proven on trees far larger than
# this one.
ignore = "0.4"
rayon = "1"

# Index. `bundled` vendors SQLite so there is no system dependency and FTS5 is
# guaranteed present -- important for a self-contained binary.
#
# `functions` and `backup` were enabled and never called. They widen the C
# surface of a vendored SQLite that already parses a database downloaded from
# another machine, which is the one dependency here where unused features are
# worth removing rather than leaving in case.
rusqlite = { version = "0.37", features = ["bundled"] }

# Tags. Over symphonia's metadata because symphonia cannot read APE tags on
# .ape/.wv/.mpc at all -- 148 files in the reference library would have none --
# and because lofty parses ReplayGain uniformly across ID3v2 TXXX, Vorbis
# comments and APEv2 instead of per-format special casing.
lofty = "0.22"

# Content-addressed cache keys for album art.
blake3 = "1"

# Config and themes. A real parser -- the reference implementation hand-rolls a
# line scanner for both and silently ignores anything it does not recognise.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# Marquee scrolling and column truncation break badly on CJK and emoji titles
# without real width measurement. Named here rather than reached through
# starkit because starkit does not re-export it: nothing in its API hands a
# `UnicodeWidthStr` back, so there is no type to keep the two copies of.
unicode-width = "0.2"

# Real-input FFT for the analyzer: about twice the throughput of a complex FFT
# of the same size, and it removes a whole class of mirrored-spectrum bugs.
realfft = "3"
rustfft = "6"

# The HTTP client, named here as well as reached through starkit because the
# scrobble and cover-art code reads and writes JSON bodies and starkit's `net`
# feature does not turn ureq's `json` on -- a theme engine has no use for it.
# Cargo unifies the two into one copy of one version, which is what matters:
# an `Agent` built by `starkit::net::agent` is this crate's `Agent`.
ureq = { version = "3", features = ["json"] }
serde_json = "1.0.151"
md5 = "0.8"
rpassword = "7"
webbrowser = "1"
discord-rich-presence = "1.1"

# Temporary files with unpredictable names, in the directory they will be
# renamed into. `playlist_dir` is configurable and meant to be shared with
# MPD, so it is the one place staramp writes that may not be private.
tempfile = "3"

[dev-dependencies]
tempfile = "3"

# Adversarial input for the parsers, generated rather than imagined. Every one
# of them reads a file somebody else wrote -- a cue sheet, a playlist, a skin,
# a preset, an ID3 frame, a packet off a link -- and a hand-written test only
# covers the malformed input its author thought of.
#
# `fork` and `timeout` are what make a case that hangs or overflows the stack
# report itself instead of taking the test binary down with it.
proptest = { version = "1", default-features = false, features = [
    "std",
    "bit-set",
    "fork",
    "timeout",
] }

# MPRIS, and only where there is a D-Bus to publish it on.
#
# Target-gated rather than always-on: zbus does compile on macOS, so this is
# not about a build failure. It is that the bus cannot exist there -- see
# `src/mpris_stub.rs` -- and roughly two megabytes of D-Bus machinery that
# provably cannot run is not worth linking.
[target.'cfg(target_os = "linux")'.dependencies]
# mpris-server handles the fiddly parts -- the Seeked signal, batching
# PropertiesChanged -- that hand-rolling on raw zbus would mean reimplementing.
mpris-server = "0.10"
# Only for zbus's async runtime. The audio path never touches it.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }

# Native decode path. Non-default features are deliberate: mp3, isomp4, aac and
# alac are all gated off by default upstream.
[dependencies.symphonia]
version = "0.5"
default-features = false
features = [
    "flac", "wav", "aiff", "pcm", "adpcm",
    "ogg", "vorbis",
    "mp3",
    "isomp4", "aac", "alac",
]

[profile.release]
# Arithmetic on lengths, offsets, frame counts and sample rates read out of
# files and off the wire. Wrapping silently in release turns a hostile number
# into a plausible wrong one, and the debug-built test suite would never see
# it. The cost is a few percent on a player that is I/O and FFT bound.
overflow-checks = true
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The audio path must not be slow in debug builds, or the whole thing is
# untestable without a release compile.
[profile.dev.package."*"]
opt-level = 2

# ---------------------------------------------------------------------------
# .deb packaging (cargo deb)
# ---------------------------------------------------------------------------
[package.metadata.deb]
maintainer = "bstar <bob@dinicolas.com>"
copyright = "2026, bstar"
license-file = ["LICENSE", "0"]
extended-description = """\
A terminal music player for local libraries, built to feel like Winamp.
Decodes FLAC, MP3, Vorbis, AAC and ALAC natively, and links libavcodec
in-process for APE, WavPack, Musepack, DSD, Opus and WMA. Understands CUE
sheets as first-class virtual tracks, including MPD's playlist URI form."""
section = "sound"
priority = "optional"
assets = [
    ["target/release/staramp", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/staramp/README.md", "644"],
    ["NOTICE", "usr/share/doc/staramp/NOTICE", "644"],
    ["packaging/staramp.desktop", "usr/share/applications/staramp.desktop", "644"],
    ["packaging/staramp.png", "usr/share/icons/hicolor/256x256/apps/staramp.png", "644"],
    ["packaging/staramp.svg", "usr/share/icons/hicolor/scalable/apps/staramp.svg", "644"],
]
# libavcodec and libavformat carry a version in their package name that differs
# per Debian release, so pinning them here would break on every other release.
# $auto resolves the real sonames from the built binary -- which means the .deb
# has to be built on a Debian-like host. CI does exactly that; building it on
# NixOS produces a package with no dependency information at all.
depends = "$auto"
# The default `unicode` glyph set uses the media control pictographs (U+23EE
# and neighbours). DejaVu, Debian's usual terminal font, does not carry them;
# Noto's symbol coverage does. A Recommends rather than a Depends: a player
# should not refuse to install over a missing glyph, and `[ui] glyphs = "ascii"`
# needs nothing at all.
recommends = "fonts-noto-core"
# `[ui] glyphs = "nerd"` wants a patched font. Debian ships one, but only the
# user's terminal can actually select it, so this stays a suggestion.
suggests = "fonts-hack-ttf"

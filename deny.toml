# cargo-deny: what the dependency tree is allowed to contain.
#
# Two questions, both of which someone has to answer eventually and neither of
# which anyone answers by hand: is a dependency carrying a known vulnerability,
# and is one carrying a licence this project cannot ship under.

[advisories]
# Vulnerabilities and yanked releases stop the build. Those are ours to act on
# however deep in the tree they are: the fix is a version bump, and if there
# is not one yet that is worth knowing today rather than at release.
yanked = "deny"

# Unmaintained crates only when we depend on one directly.
#
# A crate we chose and that has since been abandoned is a decision to revisit.
# One three levels down is its parent's decision, not ours, and cannot be
# fixed here -- `paste` is exactly that: unmaintained, no safe upgrade, and
# reached only through `lofty`. Failing the build on it would mean either
# carrying a permanent ignore or dropping a dependency over someone else's
# transitive choice.
unmaintained = "workspace"

[licenses]
# Everything in the tree today, and nothing else. Adding a dependency under a
# licence not on this list is meant to stop CI and be a decision.
#
# The list is longer than it looks: most of it is the permissive family in its
# various spellings. Two entries are worth knowing about --
#
#   MPL-2.0     symphonia and mpris-server. File-level copyleft: changes to
#               *their* files must be published, and linking them into this
#               does not affect this project's own licence.
#   WTFPL       ffmpeg-next and ffmpeg-sys-next, the bindings only. The FFmpeg
#               libraries themselves are LGPL and are covered in NOTICE.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
# A crate offering a choice takes the first of these it can satisfy, so a
# dual-licensed dependency resolves to the permissive half rather than to
# whatever its manifest happens to list first.
[licenses.private]
ignore = true

[bans]
# Duplicate versions of one crate are ordinary in a tree this size and are the
# resolver's business, not a licence question.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Nothing from a git URL or a private registry: everything comes from
# crates.io, so a compromised or vanished repository cannot reach a build.
unknown-registry = "deny"
unknown-git = "deny"

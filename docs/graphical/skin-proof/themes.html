<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AMP skin theme checks</title><style>body{margin:24px;background:#171820;color:#d7d9cf;font:15px system-ui}select{font:inherit;padding:8px;margin:12px 0}.capture{overflow:auto;padding:12px;border:1px solid #444958}img{display:block;max-width:none}a{color:#a4d791}p{max-width:850px;line-height:1.5}</style><h1>Skin masks · existing themes</h1><p>Native Rust exports at actual size, with identical content and geometry. This is the calmer FOLD-style experiment; the preserved Classic reference remains the visual target. Active-control foregrounds use a 4.5:1 contrast floor.</p><p><a href="index.html">Return to player comparison</a></p><select id="theme"><option value="ayu-dark">ayu-dark</option><option value="catppuccin-latte">catppuccin-latte</option><option value="catppuccin-mocha">catppuccin-mocha</option><option value="cosmic">cosmic</option><option value="dracula">dracula</option><option value="everforest">everforest</option><option value="gruvbox-dark">gruvbox-dark</option><option value="kanagawa">kanagawa</option><option value="matte-black">matte-black</option><option value="nord">nord</option><option value="one-dark">one-dark</option><option value="rose-pine">rose-pine</option><option value="solarized-dark">solarized-dark</option><option value="terminal">terminal</option><option value="tokyo-night">tokyo-night</option><option value="winamp-classic">winamp-classic</option></select><div class="capture"><img id="capture" width="1352" height="230" alt="Native themed player"></div><script>const s=document.getElementById('theme');function show(){document.getElementById('capture').src='theme-'+s.value+'.png'}s.addEventListener('change',show);s.value='nord';show()</script></html>
